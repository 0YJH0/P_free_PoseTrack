%YAML:1.0

dataset: "moped"
root: "dataset/moped/rinse_aid/reference/02/"
refRoot: "dataset/moped/rinse_aid/reference/00/"
cmc: "cmc/"
frames: "color/"
mask: "mask/"
angle: 3.0
width: 640
height: 480
gt: "scene/trajectory.log"
modelName: "rinse_aid-02"
modelPath: "dataset/moped/rinse_aid/reference/integrated_raw.obj"
scaledModelPath: "cmc/deformed_model_rescaled/model.obj"
scene: ""

K: "dataset/moped/rinse_aid/reference/02/intrinsics.json"

reference_imgs_nums: 1
estimated_imgs_nums: 3
max_model_deformed_nums: 3

# Differentiable Rendering Parameters
renderer_img_size: 256
iteration_nums_in_each_deform: 200
batch_size: 6
viewing_angle: 30

visualize: False

template_mesh: "sphere_2600_unit.obj"
output_dir: "dataset/moped/rinse_aid/reference/02/cmc/deformed_model"

save_obj_path: ""
save_index: 0
tracker: "tracker/bin/eg_BIT"

communication: 
    root: "dataset/moped/rinse_aid/reference/02/cmc/"

sam: 
    checkpoint: "sam_vit_b_01ec64.pth"
    model: "vit_b"
    device: "cuda"

confidence: 
    use_confidence_gate: False
    confidence_threshold: 0.5
    mask_binary_threshold: 0.5
    log_csv: "dataset/moped/rinse_aid/reference/02/cmc/deformed_model/confidence.csv"

show: 
    mask: False
    bbx: False
    points: False

save: 
    dir: ""
    mask: False
    bbx: False
    points: False
