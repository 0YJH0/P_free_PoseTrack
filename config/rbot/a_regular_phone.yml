%YAML:1.0

dataset: "rbot"
root: "dataset/RBOT_dataset/phone/"
cmc: "cmc/"
frames: "frames/"
width: 640
height: 512
angle: 3.0
mask: "mask/"
gt: "dataset/RBOT_dataset/poses_first.txt"
modelName: "phone"
modelPath: "dataset/RBOT_dataset/phone/phone.obj"
scaledModelPath: "deformed_model_rescaled/model.obj"
scene: "a_regular"

K: "config/camera/rbot_camera.yml"

reference_imgs_nums: 7
estimated_imgs_nums: 6
max_model_deformed_nums: 3

# Differentiable Rendering Parameters
renderer_img_size: 256
iteration_nums_in_each_deform: 200
batch_size: 6
viewing_angle: 30

visualize: False

template_mesh: "sphere_2600_unit.obj"
output_dir: "dataset/RBOT_dataset/phone/cmc/deformed_model"

save_obj_path: ""
save_index: 0
tracker: "tracker/bin/eg_BIT"

communication: 
    root: "dataset/RBOT_dataset/phone/cmc/"

sam: 
    checkpoint: "sam_vit_b_01ec64.pth"
    model: "vit_b"
    device: "cuda"

confidence: 
    use_confidence_gate: False
    confidence_threshold: 0.5
    mask_binary_threshold: 0.5
    log_csv: "dataset/RBOT_dataset/phone/cmc/deformed_model/confidence.csv"

show: 
    mask: False
    bbx: False
    points: False

save: 
    dir: ""
    mask: False
    bbx: False
    points: False
